name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    env:
      # Deliberately dummied values: the app must never reach a real cluster or
      # production identity provider during CI. Nothing here is a secret, and
      # the build only needs the variables to be *present*.
      MONGODB_URI: mongodb://127.0.0.1:27017/skillalloc_ci
      MONGODB_DB_NAME: skillalloc_ci
      AUTH_SECRET: ci-only-placeholder-secret-not-used-in-production
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # `eslint.ignoreDuringBuilds` is false, so lint and type errors fail here.
      - name: Production build
        run: npm run build

  python-service:
    name: Python matching service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m unittest discover -s . -p "test_*.py" -v

  audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    # Advisory only: a freshly disclosed advisory in a transitive dependency
    # must not block an unrelated bug-fix pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm

      - run: npm ci
      - run: npm audit --audit-level=high
